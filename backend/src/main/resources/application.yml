server:
  port: 8080
  servlet:
    context-path: /

spring:
  application:
    name: makkal-nagar-backend

  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/makkal_nagar_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&createDatabaseIfNotExist=true}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      idle-timeout: 30000
      connection-timeout: 20000

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    show-sql: false
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration
    validate-on-migrate: true

  web:
    resources:
      static-locations:
        - classpath:/static/
        - file:../frontend/

logging:
  level:
    root: INFO
    com.makkalnagar: DEBUG
    org.springframework.security: INFO
